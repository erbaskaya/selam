name: Selam
options:
  bundleIdPrefix: com.erbaskaya
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 7
    MARKETING_VERSION: 1.4.1
targets:
  Selam:
    type: application
    platform: iOS
    sources:
      - path: Selam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.erbaskaya.selam.ios
        PRODUCT_NAME: Selam
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Selam/Info.plist
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
