plugins {
    id "com.android.application"
}

android {
    namespace "com.erbaskaya.selam"
    compileSdk 36

    defaultConfig {
        applicationId "com.erbaskaya.selam"
        minSdk 26
        targetSdk 36
        versionCode 16
        versionName "1.6.1"

        def supabaseUrl = System.getenv("SUPABASE_URL") ?: "https://czaangjaxdffliwigcbx.supabase.co"
        // Supabase publishable anahtarı mobil istemcilerde açıkça kullanılmak üzere tasarlanmıştır.
        def supabaseAnonKey = System.getenv("SUPABASE_ANON_KEY") ?: "sb_publishable_O6uX6S8scE5ha7zYF_G32g_QKE_CEST"
        buildConfigField "String", "SUPABASE_URL", "\"${supabaseUrl}\""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"${supabaseAnonKey}\""
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            jvmArgs "--add-opens=java.base/java.lang=ALL-UNNAMED", "--add-opens=java.base/java.util=ALL-UNNAMED", "--add-opens=java.base/java.io=ALL-UNNAMED", "--add-opens=java.base/java.net=ALL-UNNAMED", "--add-opens=java.base/java.security=ALL-UNNAMED", "--add-opens=java.base/java.text=ALL-UNNAMED", "--add-opens=java.base/jdk.internal.access=ALL-UNNAMED", "--add-opens=java.desktop/java.awt.font=ALL-UNNAMED", "--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED"
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            def signingPath = System.getenv("SELAM_KEYSTORE_PATH")
            if (signingPath) {
                storeFile file(signingPath)
                storePassword System.getenv("SELAM_KEYSTORE_PASSWORD")
                keyAlias System.getenv("SELAM_KEY_ALIAS")
                keyPassword System.getenv("SELAM_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.16"
    implementation "com.journeyapps:zxing-android-embedded:4.3.0"
    implementation "io.github.webrtc-sdk:android:150.7871.01"
}
