plugins {
    id "com.android.application"
}

android {
    namespace "com.erbaskaya.selam"
    compileSdk 36

    defaultConfig {
        applicationId "com.erbaskaya.selam"
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName "1.1.0"

        def supabaseUrl = System.getenv("SUPABASE_URL") ?: ""
        def supabaseAnonKey = System.getenv("SUPABASE_ANON_KEY") ?: ""
        buildConfigField "String", "SUPABASE_URL", "\"${supabaseUrl}\""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"${supabaseAnonKey}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
