plugins {
    id "com.android.application"
}

// Client identifiers only. Server/service-account credentials must never enter an APK.
def firebaseFile = file("google-services.json")
def firebase = firebaseFile.exists() ? new groovy.json.JsonSlurper().parse(firebaseFile) : null
if (firebase?.private_key) throw new GradleException("Use Android google-services.json, never a service-account key")
def firebaseClient = firebase?.client?.find { it.client_info?.android_client_info?.package_name == "com.erbaskaya.selam" }
if (firebase && !firebaseClient) throw new GradleException("Firebase Android package must be com.erbaskaya.selam")
def firebaseValues = [FIREBASE_APP_ID: firebaseClient?.client_info?.mobilesdk_app_id,
    FIREBASE_API_KEY: firebaseClient?.api_key?.getAt(0)?.current_key,
    FIREBASE_PROJECT_ID: firebase?.project_info?.project_id,
    FIREBASE_SENDER_ID: firebase?.project_info?.project_number]
if (firebase && firebaseValues.values().any { !it }) throw new GradleException("Firebase Android configuration is incomplete")

android {
    namespace "com.erbaskaya.selam"
    compileSdk 36

    defaultConfig {
        applicationId "com.erbaskaya.selam"
        minSdk 26
        targetSdk 36
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        versionCode 18
        versionName "1.6.3"
        buildConfigField "boolean", "PUSH_CONFIGURED", firebaseClient ? "true" : "false"
        firebaseValues.each { key, value -> buildConfigField "String", key, groovy.json.JsonOutput.toJson(value?.toString() ?: "") }

        def supabaseUrl = System.getenv("SUPABASE_URL") ?: "https://czaangjaxdffliwigcbx.supabase.co"
        // Supabase publishable anahtarı mobil istemcilerde açıkça kullanılmak üzere tasarlanmıştır.
        def supabaseAnonKey = System.getenv("SUPABASE_ANON_KEY") ?: "sb_publishable_O6uX6S8scE5ha7zYF_G32g_QKE_CEST"
        buildConfigField "String", "SUPABASE_URL", "\"${supabaseUrl}\""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"${supabaseAnonKey}\""
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            jvmArgs "--add-opens=java.base/java.lang=ALL-UNNAMED", "--add-opens=java.base/java.util=ALL-UNNAMED", "--add-opens=java.base/java.io=ALL-UNNAMED", "--add-opens=java.base/java.net=ALL-UNNAMED", "--add-opens=java.base/java.security=ALL-UNNAMED", "--add-opens=java.base/java.text=ALL-UNNAMED", "--add-opens=java.base/jdk.internal.access=ALL-UNNAMED", "--add-opens=java.desktop/java.awt.font=ALL-UNNAMED", "--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED"
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            def signingPath = System.getenv("SELAM_KEYSTORE_PATH")
            if (signingPath) {
                storeFile file(signingPath)
                storePassword System.getenv("SELAM_KEYSTORE_PASSWORD")
                keyAlias System.getenv("SELAM_KEY_ALIAS")
                keyPassword System.getenv("SELAM_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.firebase:firebase-messaging:25.1.2"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.16"
    implementation "com.journeyapps:zxing-android-embedded:4.3.0"
    implementation "io.github.webrtc-sdk:android:150.7871.01"
}
