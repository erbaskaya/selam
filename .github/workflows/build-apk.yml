name: Selam APK Oluştur

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_SIGNING: ${{ secrets.SELAM_KEYSTORE_BASE64 != '' && secrets.SELAM_KEYSTORE_PASSWORD != '' && secrets.SELAM_KEY_ALIAS != '' && secrets.SELAM_KEY_PASSWORD != '' }}

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android 16 araçlarını kur
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Gradle 9.5 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Kalıcı imza anahtarını hazırla
        if: env.HAS_SIGNING == 'true'
        env:
          SELAM_KEYSTORE_BASE64: ${{ secrets.SELAM_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$SELAM_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/selam-release.jks"
          chmod 600 "$RUNNER_TEMP/selam-release.jks"

      - name: İmzalı yayın APK'sı oluştur
        if: env.HAS_SIGNING == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SELAM_KEYSTORE_PATH: ${{ runner.temp }}/selam-release.jks
          SELAM_KEYSTORE_PASSWORD: ${{ secrets.SELAM_KEYSTORE_PASSWORD }}
          SELAM_KEY_ALIAS: ${{ secrets.SELAM_KEY_ALIAS }}
          SELAM_KEY_PASSWORD: ${{ secrets.SELAM_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: İmzalı APK'yı adlandır
        if: env.HAS_SIGNING == 'true'
        run: cp app/build/outputs/apk/release/app-release.apk Selam.apk

      - name: Test APK'sı oluştur
        if: env.HAS_SIGNING != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Test APK'sını adlandır
        if: env.HAS_SIGNING != 'true'
        run: cp app/build/outputs/apk/debug/app-debug.apk Selam.apk

      - name: İmzalama durumu
        run: |
          if [ -f "$RUNNER_TEMP/selam-release.jks" ]; then
            echo "### Kalıcı yayın anahtarıyla imzalandı" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Test anahtarıyla imzalandı" >> "$GITHUB_STEP_SUMMARY"
            echo "Kalıcı güncellenebilir APK için SELAM_KEYSTORE_* Secrets değerlerini ekleyin." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: APK'yı indirilebilir yap
        uses: actions/upload-artifact@v4
        with:
          name: Selam-APK
          path: Selam.apk
          if-no-files-found: error
          retention-days: 30
